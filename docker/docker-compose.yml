services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_ADMIN_EMAILS: ${FIREBASE_ADMIN_EMAILS:-}
      VAULT_RECOVERY_MASTER_KEY: ${VAULT_RECOVERY_MASTER_KEY:-}
      AI_PROVIDER: mock
      STORAGE_PROVIDER: local-disk
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads
      # Set FIREBASE_SERVICE_ACCOUNT_FILE to the path of your downloaded
      # Admin SDK key (Firebase Console > Project Settings > Service
      # Accounts > Generate new private key) before running `docker compose up`.
      - ${FIREBASE_SERVICE_ACCOUNT_FILE}:/run/secrets/firebase-service-account.json:ro

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ""
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  uploads-data:
