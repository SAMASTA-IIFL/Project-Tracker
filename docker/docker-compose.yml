services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: product_pro
      POSTGRES_PASSWORD: product_pro
      POSTGRES_DB: product_pro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_pro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://product_pro:product_pro@postgres:5432/product_pro
      AUTH_PROVIDER: dev-credentials
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      AUTH_USERS: ${AUTH_USERS:-}
      AI_PROVIDER: mock
      STORAGE_PROVIDER: local-disk
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  uploads-data:
